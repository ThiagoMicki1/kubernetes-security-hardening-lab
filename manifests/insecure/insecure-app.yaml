# INTENTIONALLY INSECURE EXAMPLE.
# This file exists for learning and scanner demonstrations only.
apiVersion: v1
kind: Namespace
metadata:
  name: insecure-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: insecure-demo
data:
  APP_ENV: "demo"
---
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secret
  namespace: insecure-demo
type: Opaque
stringData:
  API_TOKEN: "PLACEHOLDER_ONLY_DO_NOT_USE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-webapp
  namespace: insecure-demo
  labels:
    app: insecure-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-webapp
  template:
    metadata:
      labels:
        app: insecure-webapp
    spec:
      containers:
        - name: web
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: webapp-config
            - secretRef:
                name: webapp-secret
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: insecure-webapp
  namespace: insecure-demo
spec:
  selector:
    app: insecure-webapp
  ports:
    - port: 80
      targetPort: 80
